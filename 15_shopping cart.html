<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.products{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}

.product{
    background:#fff;
    width:250px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.product img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.product h3{
    margin:10px 0;
}

.price{
    color:green;
    font-size:20px;
    margin-bottom:10px;
}

button{
    background:#007bff;
    color:#fff;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#0056b3;
}

.cart{
    margin-top:40px;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.cart h2{
    margin-bottom:15px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    padding:10px;
    border-bottom:1px solid #ddd;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
    text-align:right;
}

.remove-btn{
    background:red;
    padding:5px 10px;
}

.remove-btn:hover{
    background:darkred;
}
</style>
</head>
<body>

<h1>Shopping Cart Demo</h1>

<div class="products">

    <div class="product">
        <img src="https://via.placeholder.com/250x180" alt="">
        <h3>Laptop</h3>
        <p class="price">$800</p>
        <button onclick="addToCart('Laptop',800)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/250x180" alt="">
        <h3>Headphones</h3>
        <p class="price">$100</p>
        <button onclick="addToCart('Headphones',100)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/250x180" alt="">
        <h3>Smart Watch</h3>
        <p class="price">$150</p>
        <button onclick="addToCart('Smart Watch',150)">Add to Cart</button>
    </div>

</div>

<div class="cart">
    <h2>Shopping Cart</h2>

    <div id="cartItems"></div>

    <div class="total">
        Total: $<span id="total">0</span>
    </div>
</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
    cart.push({name, price});
    total += price;
    displayCart();
}

function removeItem(index) {
    total -= cart[index].price;
    cart.splice(index, 1);
    displayCart();
}

function displayCart() {
    const cartItems = document.getElementById("cartItems");
    cartItems.innerHTML = "";

    cart.forEach((item, index) => {
        cartItems.innerHTML += `
            <div class="cart-item">
                <span>${item.name} - $${item.price}</span>
                <button class="remove-btn"
                        onclick="removeItem(${index})">
                    Remove
                </button>
            </div>
        `;
    });

    document.getElementById("total").innerText = total;
}
</script>

</body>
</html>
