<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.checkout-form,
.order-summary{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.summary-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.total{
    font-size:20px;
    font-weight:bold;
    border-top:1px solid #ddd;
    padding-top:10px;
}

button{
    width:100%;
    padding:12px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#218838;
}

/* Responsive */
@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }

    .row{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="container">

    <!-- Billing Details -->
    <div class="checkout-form">
        <h2>Checkout</h2>

        <form>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter Full Name">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter Email">
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" placeholder="Enter Address">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" placeholder="City">
                </div>

                <div class="form-group">
                    <label>ZIP Code</label>
                    <input type="text" placeholder="ZIP">
                </div>
            </div>

            <h2>Payment Details</h2>

            <div class="form-group">
                <label>Card Holder Name</label>
                <input type="text" placeholder="Card Holder Name">
            </div>

            <div class="form-group">
                <label>Card Number</label>
                <input type="text" placeholder="1234 5678 9012 3456">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="month">
                </div>

                <div class="form-group">
                    <label>CVV</label>
                    <input type="password" placeholder="123">
                </div>
            </div>

            <button type="submit">
                Place Order
            </button>

        </form>
    </div>

    <!-- Order Summary -->
    <div class="order-summary">

        <h2>Order Summary</h2>

        <div class="summary-item">
            <span>Wireless Headphones</span>
            <span>$49.99</span>
        </div>

        <div class="summary-item">
            <span>Smart Watch</span>
            <span>$79.99</span>
        </div>

        <div class="summary-item">
            <span>Shipping</span>
            <span>$10.00</span>
        </div>

        <div class="summary-item total">
            <span>Total</span>
            <span>$139.98</span>
        </div>

    </div>

</div>

</body>
</html>
