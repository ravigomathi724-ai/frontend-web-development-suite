<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Gateway</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.payment-container{
    background:#fff;
    padding:30px;
    width:400px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.row{
    display:flex;
    gap:10px;
}

.row .input-group{
    flex:1;
}

.pay-btn{
    width:100%;
    padding:12px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

.pay-btn:hover{
    background:#218838;
}

.success{
    color:green;
    text-align:center;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="payment-container">
    <h2>Secure Payment</h2>

    <form id="paymentForm">
        <div class="input-group">
            <label>Card Holder Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="input-group">
            <label>Card Number</label>
            <input type="text" id="cardNumber" maxlength="16" placeholder="1234567812345678" required>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Expiry Date</label>
                <input type="month" id="expiry" required>
            </div>

            <div class="input-group">
                <label>CVV</label>
                <input type="password" id="cvv" maxlength="3" required>
            </div>
        </div>

        <div class="input-group">
            <label>Amount (₹)</label>
            <input type="number" id="amount" value="999" required>
        </div>

        <button type="submit" class="pay-btn">
            Pay Now
        </button>

        <p id="message" class="success"></p>
    </form>
</div>

<script>
document.getElementById("paymentForm").addEventListener("submit", function(e){
    e.preventDefault();

    let cardNumber = document.getElementById("cardNumber").value;
    let cvv = document.getElementById("cvv").value;

    if(cardNumber.length !== 16){
        alert("Card number must be 16 digits");
        return;
    }

    if(cvv.length !== 3){
        alert("CVV must be 3 digits");
        return;
    }

    document.getElementById("message").innerHTML =
        "Payment processed successfully!";
});
</script>

</body>
</html>
