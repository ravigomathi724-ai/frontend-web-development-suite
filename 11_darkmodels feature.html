<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Feature</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background-color:#ffffff;
            color:#333;
            transition:0.3s;
            text-align:center;
            padding:50px;
        }

        .container{
            max-width:600px;
            margin:auto;
        }

        h1{
            margin-bottom:20px;
        }

        p{
            margin-bottom:20px;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            background:#333;
            color:white;
            font-size:16px;
        }

        /* Dark Mode Styles */
        .dark-mode{
            background-color:#121212;
            color:#ffffff;
        }

        .dark-mode button{
            background:#f4f4f4;
            color:#121212;
        }

        .card{
            margin-top:30px;
            padding:20px;
            border-radius:10px;
            background:#f4f4f4;
        }

        .dark-mode .card{
            background:#1f1f1f;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Dark Mode Example</h1>

        <p>
            Click the button below to switch between
            Light Mode and Dark Mode.
        </p>

        <button onclick="toggleDarkMode()">
            Toggle Dark Mode
        </button>

        <div class="card">
            <h2>Sample Content</h2>
            <p>
                This content will automatically adapt
                to light and dark themes.
            </p>
        </div>

    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>

</body>
</html>
